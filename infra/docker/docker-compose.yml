services:
  email-verifier:
    build:
      context: ../../server
      dockerfile: Dockerfile

    container_name: email-verifier

    restart: unless-stopped

    env_file:
      - ../../server/.env

    ports:
      - "${PORT:-9080}:9080"

    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:9080/
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    deploy:
      resources:
        limits:
          memory: 2G